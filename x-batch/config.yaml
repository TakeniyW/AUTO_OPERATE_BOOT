# ================= Excel =================
excel:
  # token 表路径（相对路径按运行目录解析，也可写绝对路径）
  path: "accounts.xlsx"
  # 工作表名，留空 = 第一个工作表
  sheet: ""
  # token 所在列的表头名；找不到时会自动匹配 auth_token / token
  token_column: "auth_token"
  # 可选：如果表里还有 ct0 列，把表头名填这里，否则留空
  ct0_column: ""
  # 账号密码登录要用的列（token 失效时兜底）
  username_column: "账号"
  password_column: "密码"
  # 2FA 链接列，内容形如 https://2fa.xdgongju.top/?key=XXXX
  twofa_column: "2FA"
  # 首次写入前是否备份原文件（同目录生成 accounts.xlsx.bak）
  backup: true

# ================= ixBrowser =================
ixbrowser:
  # ixBrowser 客户端本地 API 地址（客户端设置里可查看）
  host: "127.0.0.1"
  port: 53200
  # 只处理窗口名称包含该关键字的窗口，留空 = 全部窗口
  profile_name_filter: ""
  # 窗口序号范围（按窗口列表顺序，1 开始；结束 0 = 到最后一个）
  profile_start: 1
  profile_end: 0
  # 最多处理几个窗口，0 = 全部
  profile_limit: 1
  # 调试用：处理完不关闭窗口
  keep_window_open: false

# ================= Twitter =================
twitter:
  home_url: "https://x.com/home"
  login_url: "https://x.com/i/flow/login"
  # 注入 cookie 后等待登录结果的超时时间（秒）
  login_timeout: 25
  # token 失败后是否改用账号密码登录（会自动获取 2FA 验证码）
  password_login: true
  # 账号密码登录的总超时时间（秒）
  password_timeout: 40
  # 单个窗口最多消耗多少个失效 token（避免整表被一个窗口耗尽）
  max_tokens_per_profile: 20
  # 网络/加载异常时同一 token 的重试次数
  retry_per_token: 1
  # 每个动作之间的随机延迟（秒），降低风控概率
  delay_min: 3.0
  delay_max: 6.0

# ================= 钱包 =================
wallet:
  enabled: true
  # auto  = 本地生成助记词并自动导入 MetaMask
  # manual= 只提示，人工在窗口里创建后回填
  # skip  = 本次不处理钱包
  mode: "auto"
  # MetaMask 扩展 ID，留空自动探测
  extension_id: ""
  # 开窗口时用 --load-extension 自动加载本地扩展（无需逐个窗口手动安装）
  # 首次使用请在 GUI「钱包」页签点「下载/安装 MetaMask」，或运行 install_metamask.bat
  auto_load_extension: true
  # 解压后的扩展目录（含 manifest.json），相对路径基于 x-batch 目录
  extension_path: "extensions/metamask"
  password_prefix: "Wx"
  password_length: 14
  # 每一步 UI 操作的等待时间（秒）
  step_timeout: 20
  # 自动导入失败时，暂停等待人工在窗口内完成
  manual_fallback: true

# ================= 行为随机化 =================
# 用于批量登录：打乱顺序、随机间隔、分批休息，降低批量特征
randomize:
  # 打乱待处理账号顺序
  shuffle_rows: true
  # 打乱窗口顺序（用序号范围手动指定窗口时建议 false）
  shuffle_profiles: false
  # 两个账号之间的随机等待（秒）
  account_delay_min: 20
  account_delay_max: 90
  # 每处理 N 个窗口后长休息，0 = 不休息
  batch_size: 0
  batch_rest_min: 300
  batch_rest_max: 900
  # 本次最多处理多少条记录，0 = 不限（配合多天分批）
  daily_limit: 0
  # 注入 token 前先以访客身份浏览一会儿
  warm_before_login: false
  warm_seconds_min: 5
  warm_seconds_max: 15

# ================= 养号 =================
warmup:
  enabled: true
  # auto = 有 token 用 token 登录；session = 只用窗口里已有的登录态
  login_mode: "auto"
  # 单账号本次停留时长（秒）
  session_min: 120
  session_max: 300
  # 滚动的随机停顿（秒）与单次最多滚动次数
  scroll_min: 2.0
  scroll_max: 7.0
  max_scrolls: 20
  # 点赞概率与单次上限
  like_prob: 0.25
  max_likes: 6
  retweet_prob: 0.03
  max_retweets: 2
  bookmark_prob: 0.05
  max_bookmarks: 2
  follow_prob: 0.04
  max_follows: 1
  # 视频 / 搜索 / 个人主页 的触发概率
  video_prob: 0.12
  search_prob: 0.30
  profile_prob: 0.25
  # 搜索关键词（留空则不搜索）
  keywords: ["AI", "Web3", "crypto", "technology"]
  # 本次最多养几个号，0 = 全部符合条件的
  accounts_per_run: 0
  # 每个号每天最多养几次
  daily_per_account: 1
  # 允许运行时段，如 "9-23"；留空 = 不限
  active_hours: ""
  # 两个号之间的随机休息（秒）
  rest_min: 60
  rest_max: 240

# ================= 输出 =================
output:
  log_dir: "logs"
  screenshot_dir: "screenshots"
  # 本地记录库，GUI 的“记录查询”页签读这里
  state_db: "data/state.db"
